<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1586" height="992" viewBox="0 0 1536 960" role="img" aria-labelledby="chart-title chart-description">
  <title id="chart-title">Keybindings</title>
  <desc id="chart-description">Sway keyboard reference chart with applications, windows, workspaces, and utilities shortcuts.</desc>
  <style>
  .title { font-family: "Noto Sans Mono", monospace; font-size: 33px; font-weight: 400; letter-spacing: 12px; fill: #ebebee; }
  .heading { font-family: "Noto Sans Mono", monospace; font-size: 19px; font-weight: 600; letter-spacing: 2.8px; fill: #91a7c4; }
  .keytext { font-family: "Noto Sans Mono", monospace; font-size: 21px; font-weight: 400; fill: #e2e3e6; }
  .plus { font-family: "Noto Sans Mono", monospace; font-size: 22px; font-weight: 400; fill: #d5d9df; }
  .command { font-family: "Noto Sans Mono", monospace; font-size: 22px; font-weight: 400; fill: #e9e9eb; }
  .keycap { fill: none; stroke: #657080; stroke-opacity: .42; stroke-width: 1.05px; }
  .rule { stroke: #6e7988; stroke-opacity: .44; stroke-width: .85px; }
</style>
  <rect width="1536" height="960" fill="#020307"/>
  <text class="title" x="768" y="61" text-anchor="middle">KEYBINDINGS</text>
  <g aria-label="Applications">
    <text class="heading" x="158" y="123">APPLICATIONS</text>
    <g aria-label="Terminal">
      <rect class="keycap" x="188" y="150.5" width="125" height="31" rx="9" ry="9"/>
      <text class="keytext" x="250.5" y="173" text-anchor="middle">SUPER</text>
      <text class="plus" x="351" y="173" text-anchor="middle">+</text>
      <rect class="keycap" x="389" y="150.5" width="124" height="31" rx="9" ry="9"/>
      <text class="keytext" x="451.0" y="173" text-anchor="middle">ENTER</text>
      <text class="command" x="685" y="174">Terminal</text>
    </g>
    <g aria-label="Application menu">
      <rect class="keycap" x="188" y="187.5" width="125" height="31" rx="9" ry="9"/>
      <text class="keytext" x="250.5" y="210" text-anchor="middle">SUPER</text>
      <text class="plus" x="351" y="210" text-anchor="middle">+</text>
      <rect class="keycap" x="389" y="187.5" width="63" height="31" rx="9" ry="9"/>
      <text class="keytext" x="420.5" y="210" text-anchor="middle">D</text>
      <text class="command" x="685" y="211">Application menu</text>
    </g>
    <g aria-label="Kill focused window, except scratchpad terminal">
      <rect class="keycap" x="188" y="224.5" width="125" height="31" rx="9" ry="9"/>
      <text class="keytext" x="250.5" y="247" text-anchor="middle">SUPER</text>
      <text class="plus" x="351" y="247" text-anchor="middle">+</text>
      <rect class="keycap" x="389" y="224.5" width="63" height="31" rx="9" ry="9"/>
      <text class="keytext" x="420.5" y="247" text-anchor="middle">Q</text>
      <text class="command" x="685" y="248">Kill focused window, except scratchpad terminal</text>
    </g>
    <g aria-label="Show scratchpad">
      <rect class="keycap" x="188" y="261.5" width="125" height="31" rx="9" ry="9"/>
      <text class="keytext" x="250.5" y="284" text-anchor="middle">SUPER</text>
      <text class="plus" x="351" y="284" text-anchor="middle">+</text>
      <rect class="keycap" x="389" y="261.5" width="63" height="31" rx="9" ry="9"/>
      <text class="keytext" x="420.5" y="284" text-anchor="middle">S</text>
      <text class="command" x="685" y="285">Show scratchpad</text>
    </g>
  </g>
  <line class="rule" x1="142" x2="1394" y1="310" y2="310"/>
  <g aria-label="Windows">
    <text class="heading" x="158" y="334">WINDOWS</text>
    <g aria-label="Fullscreen">
      <rect class="keycap" x="188" y="356.5" width="125" height="31" rx="9" ry="9"/>
      <text class="keytext" x="250.5" y="379" text-anchor="middle">SUPER</text>
      <text class="plus" x="351" y="379" text-anchor="middle">+</text>
      <rect class="keycap" x="389" y="356.5" width="63" height="31" rx="9" ry="9"/>
      <text class="keytext" x="420.5" y="379" text-anchor="middle">F</text>
      <text class="command" x="685" y="380">Fullscreen</text>
    </g>
    <g aria-label="Exit sway prompt">
      <rect class="keycap" x="188" y="395.5" width="125" height="31" rx="9" ry="9"/>
      <text class="keytext" x="250.5" y="418" text-anchor="middle">SUPER</text>
      <text class="plus" x="351" y="418" text-anchor="middle">+</text>
      <rect class="keycap" x="389" y="395.5" width="120" height="31" rx="9" ry="9"/>
      <text class="keytext" x="449.0" y="418" text-anchor="middle">SHIFT</text>
      <text class="plus" x="542" y="418" text-anchor="middle">+</text>
      <rect class="keycap" x="574" y="395.5" width="64" height="31" rx="9" ry="9"/>
      <text class="keytext" x="606.0" y="418" text-anchor="middle">E</text>
      <text class="command" x="685" y="419">Exit sway prompt</text>
    </g>
    <g aria-label="Move window left">
      <rect class="keycap" x="188" y="434.5" width="125" height="31" rx="9" ry="9"/>
      <text class="keytext" x="250.5" y="457" text-anchor="middle">SUPER</text>
      <text class="plus" x="351" y="457" text-anchor="middle">+</text>
      <rect class="keycap" x="389" y="434.5" width="109" height="31" rx="9" ry="9"/>
      <text class="keytext" x="443.5" y="457" text-anchor="middle">LEFT</text>
      <text class="command" x="685" y="458">Move window left</text>
    </g>
    <g aria-label="Move window right">
      <rect class="keycap" x="188" y="472.5" width="125" height="31" rx="9" ry="9"/>
      <text class="keytext" x="250.5" y="495" text-anchor="middle">SUPER</text>
      <text class="plus" x="351" y="495" text-anchor="middle">+</text>
      <rect class="keycap" x="389" y="472.5" width="118" height="31" rx="9" ry="9"/>
      <text class="keytext" x="448.0" y="495" text-anchor="middle">RIGHT</text>
      <text class="command" x="685" y="496">Move window right</text>
    </g>
    <g aria-label="Focus left">
      <rect class="keycap" x="188" y="511.5" width="125" height="31" rx="9" ry="9"/>
      <text class="keytext" x="250.5" y="534" text-anchor="middle">SUPER</text>
      <text class="plus" x="351" y="534" text-anchor="middle">+</text>
      <rect class="keycap" x="389" y="511.5" width="120" height="31" rx="9" ry="9"/>
      <text class="keytext" x="449.0" y="534" text-anchor="middle">SHIFT</text>
      <text class="plus" x="542" y="534" text-anchor="middle">+</text>
      <rect class="keycap" x="568" y="511.5" width="103" height="31" rx="9" ry="9"/>
      <text class="keytext" x="619.5" y="534" text-anchor="middle">LEFT</text>
      <text class="command" x="685" y="535">Focus left</text>
    </g>
    <g aria-label="Focus right">
      <rect class="keycap" x="188" y="550.5" width="125" height="31" rx="9" ry="9"/>
      <text class="keytext" x="250.5" y="573" text-anchor="middle">SUPER</text>
      <text class="plus" x="351" y="573" text-anchor="middle">+</text>
      <rect class="keycap" x="389" y="550.5" width="120" height="31" rx="9" ry="9"/>
      <text class="keytext" x="449.0" y="573" text-anchor="middle">SHIFT</text>
      <text class="plus" x="542" y="573" text-anchor="middle">+</text>
      <rect class="keycap" x="568" y="550.5" width="103" height="31" rx="9" ry="9"/>
      <text class="keytext" x="619.5" y="573" text-anchor="middle">RIGHT</text>
      <text class="command" x="685" y="574">Focus right</text>
    </g>
  </g>
  <line class="rule" x1="142" x2="1394" y1="599" y2="599"/>
  <g aria-label="Workspaces">
    <text class="heading" x="158" y="626">WORKSPACES</text>
    <g aria-label="Switch to workspaces 1–10">
      <rect class="keycap" x="188" y="648.5" width="125" height="31" rx="9" ry="9"/>
      <text class="keytext" x="250.5" y="671" text-anchor="middle">SUPER</text>
      <text class="plus" x="351" y="671" text-anchor="middle">+</text>
      <rect class="keycap" x="389" y="648.5" width="56" height="31" rx="9" ry="9"/>
      <text class="keytext" x="417.0" y="671" text-anchor="middle">1</text>
      <text class="plus" x="477" y="671" text-anchor="middle">…</text>
      <rect class="keycap" x="510" y="648.5" width="56" height="31" rx="9" ry="9"/>
      <text class="keytext" x="538.0" y="671" text-anchor="middle">0</text>
      <text class="command" x="685" y="672">Switch to workspaces 1–10</text>
    </g>
    <g aria-label="Move window to workspaces 1–10">
      <rect class="keycap" x="188" y="687.5" width="125" height="31" rx="9" ry="9"/>
      <text class="keytext" x="250.5" y="710" text-anchor="middle">SUPER</text>
      <text class="plus" x="351" y="710" text-anchor="middle">+</text>
      <rect class="keycap" x="389" y="687.5" width="120" height="31" rx="9" ry="9"/>
      <text class="keytext" x="449.0" y="710" text-anchor="middle">SHIFT</text>
      <text class="plus" x="527" y="710" text-anchor="middle">+</text>
      <rect class="keycap" x="546" y="687.5" width="42" height="31" rx="9" ry="9"/>
      <text class="keytext" x="567.0" y="710" text-anchor="middle">1</text>
      <text class="plus" x="602" y="710" text-anchor="middle">…</text>
      <rect class="keycap" x="617" y="687.5" width="50" height="31" rx="9" ry="9"/>
      <text class="keytext" x="642.0" y="710" text-anchor="middle">0</text>
      <text class="command" x="685" y="711">Move window to workspaces 1–10</text>
    </g>
  </g>
  <line class="rule" x1="142" x2="1394" y1="734" y2="734"/>
  <g aria-label="Utilities">
    <text class="heading" x="158" y="761">UTILITIES</text>
    <g aria-label="Region screenshot">
      <rect class="keycap" x="188" y="781.5" width="125" height="31" rx="9" ry="9"/>
      <text class="keytext" x="250.5" y="804" text-anchor="middle">SUPER</text>
      <text class="plus" x="351" y="804" text-anchor="middle">+</text>
      <rect class="keycap" x="389" y="781.5" width="63" height="31" rx="9" ry="9"/>
      <text class="keytext" x="420.5" y="804" text-anchor="middle">R</text>
      <text class="command" x="685" y="805">Region screenshot</text>
    </g>
    <g aria-label="Show this keybindings chart (IMV)">
      <rect class="keycap" x="188" y="820.5" width="125" height="31" rx="9" ry="9"/>
      <text class="keytext" x="250.5" y="843" text-anchor="middle">SUPER</text>
      <text class="plus" x="351" y="843" text-anchor="middle">+</text>
      <rect class="keycap" x="389" y="820.5" width="63" height="31" rx="9" ry="9"/>
      <text class="keytext" x="420.5" y="843" text-anchor="middle">K</text>
      <text class="command" x="685" y="844">Show this keybindings chart (IMV)</text>
    </g>
  </g>
</svg>
